services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/server/src:/app/packages/server/src
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://hk:POSTGRES_HOST_AUTH_METHOD%3Dtrust@postgres:5432/hafte_kasif
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - CORS_ORIGIN=http://localhost:5173
      - VITE_DEV_URL=http://client:5173
    depends_on:
      - postgres
    command: npx tsx watch packages/server/src/server.ts
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/client/src:/app/packages/client/src
      - ./packages/client/index.html:/app/packages/client/index.html
      - ./packages/client/tailwind.config.js:/app/packages/client/tailwind.config.js
    environment:
      - NODE_ENV=development
      - WS_PROXY_TARGET=ws://server:3000
      - VITE_DEV_PREVIEW=true
    command: npx vite --host 0.0.0.0 --port 5173
    working_dir: /app/packages/client
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hafte_kasif
      POSTGRES_USER: hk
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql
    secrets:
      - db_password
    restart: unless-stopped

volumes:
  pgdata:

secrets:
  db_password:
    file: ./deploy/.db_password
