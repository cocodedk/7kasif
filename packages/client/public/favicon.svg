  <!-- pupil -->
  <circle cx="46" cy="25.5" r="3" fill="#1a1a2e"/>
  <!-- eye glint -->
  <circle cx="47.5" cy="24" r="1" fill="#fff"/>
  <!-- teeth top -->
  <polygon points="54,29 56.5,32 53,32" fill="#fff"/>
  <polygon points="51,30 53.5,33 50,33" fill="#fff"/>
  <!-- teeth bottom -->
  <polygon points="54,35 56.5,32 53,32" fill="#fff"/>
  <polygon points="51,34 53.5,31 50,31" fill="#fff"/>
  <!-- mouth line -->
