<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- tail fin -->
  <polygon points="2,32 14,18 14,46" fill="#16a34a"/>
  <polygon points="5,32 14,22 14,42" fill="#22c55e"/>
  <!-- body -->
  <ellipse cx="34" cy="32" rx="22" ry="15" fill="#22c55e"/>
  <!-- dorsal fin -->
  <polygon points="24,17 34,10 38,17" fill="#16a34a"/>
  <!-- belly fin -->
  <polygon points="28,47 34,52 38,47" fill="#16a34a"/>
  <!-- eye white -->
