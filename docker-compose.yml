services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLIENT_DIR=/app/packages/client/dist
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DATABASE_URL=postgresql://hk@postgres:5432/hafte_kasif
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=https://cocodedk.github.io
      - DEBUG_GAME_LOG=1
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL:-https://7kasif.dk}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hafte_kasif
      POSTGRES_USER: hk
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hk -d hafte_kasif"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql
    secrets:
      - db_password
    restart: unless-stopped

volumes:
  pgdata:

secrets:
  db_password:
    file: ./deploy/.db_password
